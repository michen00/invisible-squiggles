---
version: 2
# Version updates only: a security update still opens a pull request of its own,
# in the commit style Dependabot detects, since a grouped entry cannot set one.
multi-ecosystem-groups:
  deps:
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
updates:
  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: deps
    cooldown:
      default-days: 7
    ignore:
      # Pinned to the engines.vscode floor on purpose. If this floats ahead,
      # vsce refuses to package and releases break. Bump both together.
      - dependency-name: '@types/vscode'
      # typescript-eslint 8.x accepts typescript <6.1.0 only, and TypeScript 7.0
      # ships no JavaScript API (typescript-eslint#10940).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  # requirements-dev.txt, and requirements-hooks.txt with its uv pip compile source.
  - package-ecosystem: uv
    directory: /
    patterns: ['*']
    multi-ecosystem-group: deps
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: build
      include: scope
    cooldown:
      # default-days only: GitHub rejects the semver-* keys for this ecosystem,
      # and an invalid key silently drops this whole entry.
      default-days: 7
