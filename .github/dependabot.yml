---
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      major:
        update-types: [major]
      minor-patch:
        update-types: [minor, patch]
    cooldown:
      semver-major-days: 30
    ignore:
      # Pinned to the engines.vscode floor on purpose. If this floats ahead,
      # vsce refuses to package and releases break. Bump both together.
      - dependency-name: '@types/vscode'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 0 1,15 * *' # 1st and 15th monthly at midnight UTC
    groups:
      actions:
        patterns: ['*']
    cooldown:
      # default-days only: GitHub rejects the semver-* keys for this ecosystem,
      # and an invalid key drops this whole entry without any local check
      # failing. The delay is long because bot-automerge.yml merges actions
      # majors with no other soak, and a compromised publisher ships a patch as
      # readily as a major.
      default-days: 30
