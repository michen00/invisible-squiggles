---
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      major:
        update-types: [major]
      minor-patch:
        update-types: [minor, patch]
    cooldown:
      semver-major-days: 30
    ignore:
      # Pinned to the engines.vscode floor on purpose. If this floats ahead,
      # vsce refuses to package and releases break. Bump both together.
      - dependency-name: '@types/vscode'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 0 1,15 * *' # 1st and 15th monthly at midnight UTC
    groups:
      actions:
        patterns: ['*']
