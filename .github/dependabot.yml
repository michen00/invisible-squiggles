---
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      major:
        update-types: [major]
      minor-patch:
        update-types: [minor, patch]
    cooldown:
      default-days: 7
    ignore:
      # Pinned to the engines.vscode floor on purpose. If this floats ahead,
      # vsce refuses to package and releases break. Bump both together.
      - dependency-name: '@types/vscode'
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    cooldown:
      # default-days only: GitHub rejects the semver-* keys for this ecosystem,
      # and an invalid key silently drops this whole entry.
      default-days: 7
