---
name: Bot auto-merge

# Arms GitHub's native auto-merge (squash) on Dependabot patch, minor and major PRs and
# on pre-commit-ci hook bumps. GitHub performs the merge only once the PR is mergeable --
# required checks green, no unresolved review threads -- so leaving a review comment
# pauses it until that thread is resolved.
#
# Majors ride on green CI in every ecosystem. For npm that is strong evidence: CI drives
# the extension end to end -- type-check, lint, unit, integration and E2E across two
# operating systems and two VSCode versions, and Package VSIX, which runs
# `make verify-reproducible` and so exercises vsce -- and every one of those is required to
# merge, being a `needs` of the CI complete job that branch protection names. For
# github-actions it is evidence only for workflows a pull request runs, and a major that
# reaches any other workflow merges on it anyway; the eligibility step says what that
# costs. scripts/test-bot-automerge.cjs pins the policy and the ecosystem names.
#
# The guard reads pull_request.user.login, not github.actor. github.actor is whoever
# triggered *this* event rather than whoever opened the PR, so any later push by another
# identity makes that synchronize event's actor the other identity and the job skips --
# leaving only the `opened` event as a chance to act, with no retry. user.login stays
# dependabot[bot] for the life of the PR. It is not spoofable: GitHub records it as the
# authenticated author, never derived from PR content, and the [bot] suffix cannot occur
# in a human account name.
#
# There is deliberately no in-workflow check polling. `gh pr checks --watch` races check
# registration and fails with "no required checks reported" before CI has posted;
# native auto-merge gates on the ruleset server-side instead.
#
# The merge is attributed to github-actions[bot], which suppresses downstream push
# events. Nothing here depends on those: changelog-autoupdate.yml runs on a schedule and
# publish.yml triggers on releases.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bot-automerge:
    # `do not auto-merge` is the kill switch, and this is the path that needs one:
    # arming takes no human action, so without a label there is nothing to withhold.
    #
    # This check alone only stops the job from arming again. Auto-merge already enabled
    # lives server-side, so a label applied afterwards would not turn it off --
    # bot-automerge-disarm.yml does that, and is the half that makes arming defensible.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.user.login == 'pre-commit-ci[bot]') &&
      !contains(github.event.pull_request.labels.*.name, 'do not auto-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      # No checkout step: nothing below reads the repository.

      # Optional, and inert unless both settings resolve. Arming under an App matters
      # because auto-merge is completed by whoever armed it, and GitHub creates no workflow
      # run for an event caused by `GITHUB_TOKEN` -- so a `GITHUB_TOKEN` merge fires no
      # `push` and no `pull_request_target: closed` trigger downstream, while an App merge
      # does. The note at the top of this file says nothing here depends on those triggers,
      # and that stays true; this buys the option rather than a fix for a current break.
      #
      # Neither setting exists here yet, so this resolves false on every run and the whole
      # App path is inert -- which is why it is written as a detection rather than a
      # requirement. Note that a Dependabot-triggered run is handed the *Dependabot* secret
      # store rather than the Actions one, so whenever these are added the private key has
      # to go into both stores or the App path stays inert on exactly the pull requests it
      # was added for. Saying so here is the point: the failure is otherwise entirely silent
      # -- the token comes back empty and the fallback takes over with nothing logged.
      - name: Detect App credentials
        id: creds
        env:
          APP_ID_VALUE: ${{ vars.APP_ID }}
          APP_KEY_VALUE: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$APP_ID_VALUE" ] && [ -n "$APP_KEY_VALUE" ]; then
            echo "available=true" >>"$GITHUB_OUTPUT"
          else
            echo "available=false" >>"$GITHUB_OUTPUT"
            echo "::notice::No App credential on this run; arming under the default" \
                 "token. The merge will fire no downstream push or closed event."
          fi

      # `APP_ID` holds the App's numeric id, which is what `create-github-app-token` wants;
      # the client id is the separate `Iv23li...` string and is not what goes here. The
      # sibling repositories use the same two names, so a key rotation is one operation
      # across all of them rather than several spellings to remember. It is a variable
      # rather than a secret because `if:` can read `vars` and cannot read `secrets`, and
      # that test is what keeps this path optional.
      - name: Mint an App token, if one is configured
        id: app-token
        if: steps.creds.outputs.available == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Without these the token inherits every permission the installation holds, which
          # is more than this job declares for itself. Narrowing the borrowed identity to
          # match the default one keeps the two carrying the same authority.
          permission-contents: write
          permission-pull-requests: write

      # `continue-on-error` above means a failed mint does not stop the job, so it has to be
      # reported here or it passes unnoticed. Worth knowing while reading a run: a
      # `continue-on-error` step is recorded as `conclusion: success` by the jobs API even
      # when its log carries a hard refusal, so this notice is the only honest signal short
      # of opening the log.
      - name: Report a mint that failed
        if: >-
          steps.creds.outputs.available == 'true' &&
          (steps.app-token.outcome != 'success' || steps.app-token.outputs.token == '')
        run: |
          echo "::warning::App credentials are set but minting failed; falling back to" \
               "the default token. Auto-merge still works; downstream triggers will not."

      - name: Fetch Dependabot metadata
        id: meta
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v3

      # Dependabot's metadata trailer omits update-type for some ecosystems. v3 recovers
      # it by parsing the "Updates X from A to B" line in the commit message; v2 did not.
      # Keep this at v3 or newer or those ecosystems silently stop merging. When even
      # that recovery finds no versions there is nothing to gate on, so hold for a human
      # -- but say so, because a green run that merged nothing is otherwise
      # indistinguishable from a deliberate hold.
      - name: Report metadata that cannot be gated on
        if: >-
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          !steps.meta.outputs.update-type
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          echo "::notice::No update-type for ${ECOSYSTEM:-unknown}; leaving this for a human."

      - name: Decide eligibility
        id: eligible
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Every commit must have been created by GitHub itself, and be the bot's own
          # unless it is a merge.
          #
          # Author identity alone is not a guard: .author.login is resolved from the
          # commit's author email, so anyone who can push can set it to dependabot's
          # noreply address and be read as the bot.
          #
          # `.committer.login == "web-flow"` is the load-bearing half, and it is
          # deliberately not the payload text. GitHub resolves that field from the signing
          # key itself, so it is not metadata a pusher can set: measured on real pull
          # requests across four repositories, both Dependabot and pre-commit-ci commits
          # report `web-flow` with `verified: true` and `reason: valid`, while a human's
          # own commits report that human's login.
          #
          # The payload test naming `committer GitHub <noreply@github.com>` stays as an
          # independent second condition rather than as the argument. On its own it would
          # rest on an unstated premise -- that GitHub declines to mark a commit verified
          # when its committer email is not a verified email of the signing key's owner --
          # and a guard should not rest on a premise its reader cannot check. A review on
          # a sibling repository read that earlier form as spoofable, which was half right:
          # the specific bypass most likely fails, but the check was keyed on the wrong
          # field. Requiring both means the guard holds either way. A locally pushed commit
          # is signed by the pusher's own key, or not at all, and neither comes back as
          # `web-flow`.
          #
          # Merges are exempt from the author check but not from the signature check, and
          # that pairing is what makes the exemption safe. A merge commit's tree is not
          # constrained to be the mechanical merge of its parents, so a local "evil merge"
          # can carry content present in neither parent while contributing no non-merge
          # commits to the range. Requiring GitHub's signature rules that out: the only
          # merges GitHub signs are the mechanical ones its own UI produces, and the button
          # cannot inject a tree. That is what lets a required Update branch merge through
          # without reopening the hole.
          #
          # `set -e` does the fail-closed work. Every hand-written error branch here has
          # been a way to fail open instead. So no `2>/dev/null` and no `|| fallback` -- if
          # the query fails the step dies, should_merge is never set, the steps below skip,
          # and the error is in the log where whoever is debugging can read it.
          set -euo pipefail
          jq_rows='.[] | [
            (if (.commit.verification.verified == true)
                and (.commit.verification.reason == "valid")
                and ((.committer.login // "") == "web-flow")
                and ((.commit.verification.payload // "") | split("\n")
                     | any(startswith("committer GitHub <noreply@github.com>")))
             then "github" else "elsewhere" end),
            (if (.parents | length) >= 2 then "merge" else "plain" end),
            (.author.login // "<none>")
          ] | join("|")'
          # This endpoint returns at most 250 commits and --paginate still exits 0, so a
          # longer PR would be inspected only in part and the unseen tail could be
          # anything. Count first and refuse rather than under-inspect. A bot PR reaching
          # 250 commits suggests something is wrong regardless.
          total=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.commits')
          if [ "$total" -gt 250 ]; then
            echo "::warning::${total} commits exceeds the 250 this API returns; holding."
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rows=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/commits" --paginate --jq "$jq_rows")
          seen=$(printf '%s\n' "$rows" | grep -c . || true)
          if [ "$seen" -ne "$total" ]; then
            echo "::warning::inspected ${seen} of ${total} commits; holding."
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rejected=0
          while IFS='|' read -r origin kind commit_author; do
            [ -z "$origin" ] && continue
            if [ "$origin" != "github" ]; then
              echo "::warning::a commit was not created by GitHub; holding."
              rejected=$((rejected + 1))
            elif [ "$kind" != "merge" ] && [ "$commit_author" != "$AUTHOR" ]; then
              echo "::warning::non-merge commit authored by ${commit_author}; holding."
              rejected=$((rejected + 1))
            fi
          done <<< "$rows"
          if [ "$rejected" -ne 0 ]; then
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$AUTHOR" = "pre-commit-ci[bot]" ]; then
            echo "::notice::pre-commit-ci hook bump; eligible for auto-merge."
            echo "should_merge=true" >> "$GITHUB_OUTPUT"
          elif [ "$UPDATE_TYPE" = "version-update:semver-patch" ] || \
               [ "$UPDATE_TYPE" = "version-update:semver-minor" ]; then
            echo "::notice::Dependabot ${UPDATE_TYPE}; eligible for auto-merge."
            echo "should_merge=true" >> "$GITHUB_OUTPUT"
          elif [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
            # Majors merge on green too, in every ecosystem and with no exceptions. A major
            # is accepted once every required check passes: the latest version is almost
            # always the one wanted, and a major held for a person is a merge somebody has
            # to remember to make.
            #
            # The trade-off is accepted rather than overlooked. Green CI is evidence only
            # about code a pull request runs. An actions major whose `uses:` line sits in a
            # workflow no pull request executes -- a release, publish or scheduled job, or a
            # step whose condition is false on a bot pull request -- merges with nothing
            # having exercised it, and so does a dependency major on a path CI does not
            # cover. A break there surfaces the next time that code runs, and is fixed
            # forward. Here that includes publish.yml, whose azure/login and
            # actions/attest-build-provenance steps run only when publishing, and
            # changelog-autoupdate.yml and pre-commit-autoupdate.yml, which run on a
            # schedule or when dispatched. An npm major that only the publish path uses,
            # such as ovsx, is in the same position: package.json changes, CI goes green,
            # and the first run that exercises it is a release.
            #
            # The cooldowns in dependabot.yml are the soak: Dependabot raises no pull
            # request for a release until its cooldown has passed. Their effective length
            # is longer than the number suggests for actions, which is worth knowing before
            # tuning it: that ecosystem is polled on the 1st and 15th, so an update whose
            # cooldown expires just after a poll waits until the next one. Thirty days of
            # cooldown therefore lands a pull request roughly thirty to forty-five days
            # after the release.
            #
            # Nothing here reads the ecosystem except the log line. If a test on it ever
            # returns, compare against fetch-metadata's slugs and not the keys
            # dependabot.yml is written in: the action takes package-ecosystem from the
            # branch name, so it reports `npm_and_yarn` and `github_actions`, never `npm` or
            # `github-actions`. A comparison against a config key does not fail loudly. It
            # never matches, every major it was meant to arm falls through to a hold, and
            # the run stays green. That is how every npm major here was once merged by hand.
            # scripts/test-bot-automerge.cjs pins the slugs against dependabot.yml, and runs
            # this step to check that a major is eligible in every configured ecosystem,
            # even on a diff that reaches publish.yml.
            echo "::notice::${ECOSYSTEM:-unknown} major; eligible on green CI."
            echo "should_merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Holding ${UPDATE_TYPE:-unknown update type} for a human."
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
          fi

      # The label is re-read live rather than taken from the event payload. A label
      # applied while this run was in flight is not in that payload, and the disarm
      # workflow runs in its own concurrency group, so it can finish before this step
      # arms -- leaving the PR armed with the kill switch applied. Checking here closes
      # that ordering gap; the disarm workflow covers the label arriving afterwards.
      - name: Re-check the kill switch, then arm, and approve
        if: steps.eligible.outputs.should_merge == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Overrides the job-level GH_TOKEN when an App token was minted. This is the step
          # whose identity decides the merge event's identity, so it is the only one where
          # the borrowed token changes anything observable.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          # Read into a variable first, under `set -e`. Piping the query straight into
          # grep would treat a failed query as "label absent" -- grep sees no input,
          # matches nothing, and the step arms without ever having verified the switch.
          set -euo pipefail
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          # Case-insensitive and fixed-string: GitHub treats label names as unique
          # case-insensitively, so "Do Not Auto-Merge" is the same switch to a human and
          # must be to this check too.
          if grep -qixF 'do not auto-merge' <<< "$labels"; then
            echo "::warning::do not auto-merge applied since this run started; not arming."
            exit 0
          fi
          #
          # Arming comes before approving, so no approval outlives an arm that did not
          # happen: a declined arm exits above and a failed one ends the step under
          # `set -e`, each before any review exists. Nothing would withdraw such an
          # approval -- the disarm workflow turns auto-merge off and does not dismiss a
          # review. Arming a pull request not yet approved is safe: auto-merge waits on
          # the review requirement like any other, so nothing merges before the approval
          # lands.
          #
          # This costs one API call on a pull request already re-approved, which is
          # precaution rather than necessity, and the failure is tolerated for the same
          # reason: if Actions approval is ever disallowed, auto-merge waits for a human,
          # which is the safe direction.
          gh pr merge --auto --squash "$PR_URL"
          decision=$(gh pr view "$PR_NUMBER" --json reviewDecision --jq .reviewDecision)
          if [ "$decision" = "APPROVED" ]; then
            echo "::notice::Already approved."
          else
            gh pr review --approve "$PR_NUMBER" ||
              echo "::warning::approval refused; auto-merge will wait for a reviewer."
          fi
