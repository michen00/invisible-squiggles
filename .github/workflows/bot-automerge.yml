---
name: Bot auto-merge

# Arms native auto-merge (squash) on eligible Dependabot and pre-commit-ci pull requests
# and approves them. scripts/test-bot-automerge.cjs tests this workflow.
#
# No check polling: `gh pr checks --watch` fails when it runs before CI has registered
# its checks, and auto-merge waits for required checks anyway.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bot-automerge:
    # The guard reads `pull_request.user.login`, not `github.actor`: the actor is whoever
    # caused this event, so a later push by anyone else would skip the job.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.user.login == 'pre-commit-ci[bot]') &&
      !contains(github.event.pull_request.labels.*.name, 'do not auto-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      # Optional App identity for arming: auto-merge completes as whoever armed it, and a
      # merge under `GITHUB_TOKEN` starts no workflows, so pr-catchup.yml would not run.
      # Dependabot-triggered runs read only the Dependabot secret store, so the key must be
      # in both stores.
      - name: Detect App credentials
        id: creds
        env:
          APP_CLIENT_ID_VALUE: ${{ vars.APP_CLIENT_ID }}
          APP_KEY_VALUE: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$APP_CLIENT_ID_VALUE" ] && [ -n "$APP_KEY_VALUE" ]; then
            echo "available=true" >>"$GITHUB_OUTPUT"
          else
            echo "available=false" >>"$GITHUB_OUTPUT"
            echo "::notice::No App credential on this run; arming under the default" \
                 "token. The merge will fire no downstream push or closed event."
          fi

      # `APP_CLIENT_ID` is the App's client ID, which the action reads from `app-id` when
      # `client-id` is unset.
      - name: Mint an App token, if one is configured
        id: app-token
        if: steps.creds.outputs.available == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # `continue-on-error` records a failed mint as a success, so report it here.
      - name: Report a mint that failed
        if: >-
          steps.creds.outputs.available == 'true' &&
          (steps.app-token.outcome != 'success' || steps.app-token.outputs.token == '')
        run: |
          echo "::warning::App credentials are set but minting failed; falling back to" \
               "the default token. Auto-merge still works; downstream triggers will not."

      - name: Fetch Dependabot metadata
        id: meta
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v3

      - name: Report metadata that cannot be gated on
        if: >-
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          !steps.meta.outputs.update-type
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          echo "::notice::No update-type for ${ECOSYSTEM:-unknown}; leaving this for a human."

      - name: Decide eligibility
        id: eligible
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The author login alone proves nothing: it is resolved from the author email,
          # which any pusher can set. So every commit must also be created by GitHub.
          #
          # Merges skip the author check so that Update branch and catch-up merges pass.
          # GitHub also signs commits that an App or `GITHUB_TOKEN` creates through its API,
          # with any tree and parents, so this trusts any holder of a write token. Where the
          # base branch requires approval of the most recent push, the approval below does
          # not count on a commit github-actions pushed.
          #
          # Fails closed: a failed query leaves `should_merge` unset, so nothing is armed.
          set -euo pipefail
          jq_rows='.[] | [
            (if (.commit.verification.verified == true)
                and (.commit.verification.reason == "valid")
                and ((.committer.login // "") == "web-flow")
                and ((.commit.verification.payload // "") | split("\n")
                     | any(startswith("committer GitHub <noreply@github.com>")))
             then "github" else "elsewhere" end),
            (if (.parents | length) >= 2 then "merge" else "plain" end),
            (.author.login // "<none>")
          ] | join("|")'
          # The endpoint returns at most 250 commits and `--paginate` still exits 0, so
          # refuse rather than inspect part of the pull request.
          total=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.commits')
          if [ "$total" -gt 250 ]; then
            echo "::warning::${total} commits exceeds the 250 this API returns; holding."
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rows=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/commits" --paginate --jq "$jq_rows")
          seen=$(printf '%s\n' "$rows" | grep -c . || true)
          if [ "$seen" -ne "$total" ]; then
            echo "::warning::inspected ${seen} of ${total} commits; holding."
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rejected=0
          while IFS='|' read -r origin kind commit_author; do
            [ -z "$origin" ] && continue
            if [ "$origin" != "github" ]; then
              echo "::warning::a commit was not created by GitHub; holding."
              rejected=$((rejected + 1))
            elif [ "$kind" != "merge" ] && [ "$commit_author" != "$AUTHOR" ]; then
              echo "::warning::non-merge commit authored by ${commit_author}; holding."
              rejected=$((rejected + 1))
            fi
          done <<< "$rows"
          if [ "$rejected" -ne 0 ]; then
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$AUTHOR" = "pre-commit-ci[bot]" ]; then
            echo "::notice::pre-commit-ci hook bump; eligible for auto-merge."
            echo "should_merge=true" >> "$GITHUB_OUTPUT"
          elif [ "$UPDATE_TYPE" = "version-update:semver-patch" ] || \
               [ "$UPDATE_TYPE" = "version-update:semver-minor" ]; then
            echo "::notice::Dependabot ${UPDATE_TYPE}; eligible for auto-merge."
            echo "should_merge=true" >> "$GITHUB_OUTPUT"
          elif [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
            # CI exercises only code a pull request runs, so a major used only by a workflow
            # that no pull request starts, or on a path CI does not cover such as publishing,
            # merges untested.
            echo "::notice::${ECOSYSTEM:-unknown} major; eligible on green CI."
            echo "should_merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Holding ${UPDATE_TYPE:-unknown update type} for a human."
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
          fi

      # Re-read the label: one applied during this run is not in the event payload, and the
      # disarm run may already have finished.
      - name: Re-check the kill switch, then arm, and approve
        if: steps.eligible.outputs.should_merge == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          ARM_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          # Read into a variable under `set -e`, so a failed query is not read as "no label".
          set -euo pipefail
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          # Case-insensitive, as GitHub compares label names.
          if grep -qixF 'do not auto-merge' <<< "$labels"; then
            echo "::warning::do not auto-merge applied since this run started; not arming."
            exit 0
          fi
          # Arm before approving: the disarm workflow does not dismiss reviews, so an
          # approval must not outlive an arm that failed.
          #
          # Approve as github-actions, never as the App: where the base branch requires
          # approval of the most recent push, the last pusher's approval does not count,
          # and pr-catchup.yml pushes as the App.
          GH_TOKEN="$ARM_TOKEN" gh pr merge --auto --squash "$PR_URL"
          decision=$(gh pr view "$PR_NUMBER" --json reviewDecision --jq .reviewDecision)
          if [ "$decision" = "APPROVED" ]; then
            echo "::notice::Already approved."
          else
            gh pr review --approve "$PR_NUMBER" ||
              echo "::warning::approval refused; auto-merge will wait for a reviewer."
          fi
