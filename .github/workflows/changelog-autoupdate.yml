---
name: Changelog autoupdate
on:
  schedule:
    - cron: '0 0 * * 1' # Run every Monday at 00:00
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  BRANCH_NAME: chore/changelog-autoupdate

jobs:
  changelog-autoupdate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history needed for git cliff
      - name: Install git-cliff
        uses: taiki-e/install-action@v2.85.4
        with:
          tool: git-cliff
      # git-cliff needs a token to resolve commit authors to GitHub usernames.
      # Without it the changelog degrades to [Name](mailto:email) for every entry.
      - name: Update Unreleased section
        run: scripts/update-unreleased.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `fix` because the step is named for what it should do and did not: without it the
      # action only reported, and the name was aspirational. `continue-on-error` because
      # --fix cannot close every violation -- MD033 has no fixer, so one commit subject
      # carrying inline HTML exits 1, `create-pull-request` never runs, and the repair is
      # discarded with the runner. The changelog would then stop updating silently, which
      # is a worse failure than an unformatted heading.
      #
      # Nothing is lost by not blocking here: the pull request this opens is itself linted
      # by pre-commit.ci, which runs markdownlint --fix, so a violation surfaces where
      # somebody can act on it rather than suppressing the pull request entirely.
      - name: Format CHANGELOG.md
        continue-on-error: true
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: .markdownlint.yml
          fix: true
          globs: |
            CHANGELOG.md
      - name: Push changes and create PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: '${{ env.BRANCH_NAME }}'
          sign-commits: true
          title: 'docs(CHANGELOG.md): autoupdate Unreleased section'
          body: |
            This PR updates the Unreleased section of CHANGELOG.md with recent commits.

            Generated by [git-cliff](https://git-cliff.org/).
          commit-message: 'docs(CHANGELOG.md): autoupdate Unreleased section'
          delete-branch: true
          base: main
