---
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: setup-python
        with:
          check-latest: true
          cache: pip
      - name: Install pre-commit
        run: |
          pip install --upgrade pip
          pip install --upgrade pre-commit
      - name: Cache pre-commit hooks
        id: cache-pre-commit-hooks
        uses: actions/cache@v6
        env:
          CACHE_NUMBER: 0
        with:
          path: ~/.cache/pre-commit
          key: >
            ${{ runner.os }}-precommit-
            ${{ steps.setup-python.outputs.python-version }}-
            ${{ hashFiles('.pre-commit-config.yaml') }}-
            ${{ env.CACHE_NUMBER }}
      - name: Install pre-commit hooks
        if: steps.cache-pre-commit-hooks.outputs.cache-hit != 'true'
        run: |
          pre-commit install-hooks
      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files

  unit-tests:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20.x
          - 22.x
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and lint
        run: npm run pretest
      - name: Run unit tests with coverage
        run: npm run test:coverage
      # The same tests again, in mocha's parallel mode. Not for the tests --
      # they already passed on the line above -- but for the one dependency the
      # serial run never loads. mocha requires serialize-javascript only from
      # lib/nodejs/buffered-worker-pool.js, so a serial run leaves it untouched,
      # and package.json overrides it past the range mocha declares. Without
      # this step nothing installs, loads, or executes the overridden package,
      # and a breaking major would reach main with every check green.
      - name: Run unit tests in parallel mode
        run: npm run test:unit:parallel
      - name: Upload coverage to Codecov
        if: matrix.node == '22.x'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

  # Packaging is the only step that exercises vsce, and nothing else in CI ran
  # it. That let two whole classes of breakage reach main unnoticed:
  #   - manifest drift: vsce refuses to package when @types/vscode declares a
  #     version above engines.vscode, which a dependabot bump silently caused
  #   - Git LFS pointers reaching vsce: it packages a 130-byte pointer file
  #     without warning, shipping an extension whose icon is ASCII text
  # Neither is visible to type-checking, linting, or the test suites.
  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      # `verify-reproducible`, not `build-vsix`: build-vsix depends on `install`,
      # which would re-run `npm install` on top of the `npm ci` above, and it
      # packages only once. This packages twice under different umasks and fails
      # if the two disagree, so the invariant the publish retry path depends on is
      # checked on every PR rather than first exercised on a tagged release.
      - name: Package VSIX and verify reproducibility
        run: make verify-reproducible
      # Lets a reviewer install the exact build from a PR before merging.
      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: ./*.vsix
          if-no-files-found: error

  get-vscode-version:
    name: Get VSCode version
    runs-on: ubuntu-latest
    outputs:
      min: ${{ steps.version.outputs.min }}
    steps:
      - uses: actions/checkout@v7
      - name: Get minimum VSCode version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').engines.vscode.replace('^', '')")
          echo "min=$VERSION" >> "$GITHUB_OUTPUT"

  e2e-tests:
    name: E2E tests (VSCode ${{ matrix.vscode }}, ${{ matrix.os }})
    needs: get-vscode-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        vscode:
          - ${{ needs.get-vscode-version.outputs.min }}
          - stable
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - name: Cache VSCode downloads
        uses: actions/cache@v6
        with:
          path: ~/.vscode-test
          key: ${{ runner.os }}-vscode-${{ matrix.vscode }}-${{ hashFiles('package.json') }} # yamllint disable-line rule:line-length
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run pretest
      - name: Run integration tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 2
          polling_interval_seconds: 2
          retry_on: error
          command: |
            BASE_CMD="npm run test:integration -- --code-version ${{ matrix.vscode }}"
            if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
              BASE_CMD="xvfb-run -a $BASE_CMD"
            fi
            $BASE_CMD
      - name: Run E2E tests
        run: |
          BASE_CMD="npm run test:e2e -- --code-version ${{ matrix.vscode }}"
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            BASE_CMD="xvfb-run -a $BASE_CMD"
          fi
          $BASE_CMD

  # The single check branch protection requires. Everything above reports under a name
  # this file computes -- `Unit tests (Node ${{ matrix.node }})` and `E2E tests (VSCode
  # ${{ matrix.vscode }}, ...)`, where that VSCode value is read out of package.json's
  # engines floor. Naming those directly in the ruleset couples repository settings to a
  # matrix axis: dropping Node 20 or raising the engines floor renames a required check
  # out of existence, and every pull request then waits forever on a context that will
  # never report. Nothing in the repository can catch that, because the required list
  # lives in settings no test here can read.
  #
  # So the ruleset names this job and nothing else. Its name is a literal, and the set of
  # jobs it covers moves into this file, where scripts/test-ci-complete.cjs asserts that
  # `needs` lists every other job -- a new job that forgets to register here fails that
  # suite instead of quietly falling outside the merge gate.
  #
  # `if: always()` is load-bearing rather than defensive. Without it a failed dependency
  # leaves this job skipped, and GitHub counts a skipped required check as satisfied --
  # the gate would pass by not running, which is the one outcome it exists to prevent.
  ci-complete:
    name: CI complete
    needs: [pre-commit, unit-tests, package, get-vscode-version, e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The contract check runs here, inside the gate, and not only in its own workflow.
      # `needs` is hand-written, and this job can evaluate only the jobs already named in
      # it: a job added to ci.yml and left out of `needs` makes the separate suite red
      # while this gate stays green, and once this is the only required context, that
      # pull request merges anyway. Running it here is what makes the omission fail the
      # thing branch protection actually reads.
      - name: Checkout
        uses: actions/checkout@v7
      - name: Assert the gate covers every job
        run: |
          scripts/test-ci-complete.cjs
      # Query and test are separate statements for the same reason they are in
      # bot-automerge.yml: as one pipeline, a jq that failed to parse the context would
      # yield an empty failure list and read as success. Split under `set -e`, a broken
      # query kills the step, and the length check refuses a context that arrived empty
      # -- a renamed job would otherwise drop out of `needs` and be counted as nothing
      # rather than as a failure.
      - name: Assert every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          count=$(printf '%s' "$RESULTS" | jq -r 'to_entries | length')
          if [ "$count" -eq 0 ]; then
            echo "::error::needs context is empty; this gate covered nothing."
            exit 1
          fi
          failed=$(printf '%s' "$RESULTS" \
            | jq -r 'to_entries[] | select(.value.result != "success")
                     | "\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            echo "::error::CI is not complete; $count jobs checked:"
            printf '%s\n' "$failed"
            exit 1
          fi
          echo "All $count jobs succeeded."
