---
name: PR body unwrap check

# The report-only sibling of pr-body-unwrap.yml, for the two events that
# workflow deliberately skips. It rewrites only on opened, reopened, and
# ready_for_review, because rewriting on every push risks dropping text an
# author is still typing; this checks synchronize and edited instead, so a
# body that picks up a manual wrap later in review is still caught.
#
# Deterministic detection, so this is allowed to block.
#
# Runs on pull_request_target rather than pull_request so a fork-originated
# push or edit still gets a report: pull_request downgrades GITHUB_TOKEN to
# read-only for fork-originated runs, silently disabling this job's
# pull-requests: write grant on exactly the contributions CONTRIBUTING.md
# documents as the primary path. Safe here because nothing from the pull
# request is checked out or executed -- only its body text, carried in the
# event payload -- matching what unwrap-pr-body-check.yml's own SECURITY.md
# guarantees for this call.
#
# Calls michen00/markdown-prose-hooks/.github/workflows/unwrap-pr-body-check.yml,
# documented under "On a pull request body" in that project's README. A
# bot-authored or empty body is skipped by the reusable workflow itself.
#
# Pinned to v0.5.0 for the same reason as the sibling workflow: v0.4.0
# predates this file.

on:
  pull_request_target:
    types: [synchronize, edited]

jobs:
  report:
    permissions:
      pull-requests: write
    uses: michen00/markdown-prose-hooks/.github/workflows/unwrap-pr-body-check.yml@v0.5.0
    with:
      fail-on-wrapped: true
