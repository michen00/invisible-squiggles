---
name: PR mechanical checks

# The deterministic gate on a pull request's title, commit subjects, and body.
# Errors block; warnings print as annotations and do not fail. michen00/pr-checks
# checks the title and body, and skips a bot's pull request; the commit-subject
# check is this repository's own.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The maximum for the PR title and every commit subject, counted as typed: a
      # positive whole number, or 'off' to leave the length unchecked.
      SUBJECT_MAX_LENGTH: '50'
    steps:
      # Full depth so the commit-subject range resolves.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          check-latest: true

      - name: Check the title and body
        id: pr
        continue-on-error: true
        uses: michen00/pr-checks@db89b15bfdb59cf850f498b56d9e3aaba0b2c005 # v0.1.0
        with:
          max-length: ${{ env.SUBJECT_MAX_LENGTH }}
          upload-findings: 'false'

      - name: Check commit subjects
        id: commits
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_ERRORS_FILE: ${{ runner.temp }}/pr-errors/commit-subjects.txt
        run: |
          git fetch --quiet origin "$BASE_REF"
          python -m checks.check_commit_messages "origin/${BASE_REF}..HEAD"

      # continue-on-error above lets both run; this is what makes the job red. Each
      # outcome is measured against `success`, because a step held back by an earlier
      # hard failure reports `skipped`.
      - name: Fail if any check did not pass
        if: always()
        env:
          PR_OUTCOME: ${{ steps.pr.outcome }}
          COMMITS_OUTCOME: ${{ steps.commits.outcome }}
          COMMITS_ERRORS_FILE: ${{ runner.temp }}/pr-errors/commit-subjects.txt
        run: |
          set -eu
          bad=""
          if [ "$PR_OUTCOME" != success ]; then
            bad="$bad title-and-body=$PR_OUTCOME"
          fi
          if [ "$COMMITS_OUTCOME" != success ]; then
            detail=""
            if [ -s "$COMMITS_ERRORS_FILE" ]; then
              detail=": $(awk 'NR>1{printf "; "} {printf "%s", $0}' "$COMMITS_ERRORS_FILE")"
            fi
            bad="$bad commit-subjects=$COMMITS_OUTCOME$detail"
          fi
          if [ -n "$bad" ]; then
            echo "::error::these checks did not pass:$bad"
            exit 1
          fi
          echo "every check passed"
