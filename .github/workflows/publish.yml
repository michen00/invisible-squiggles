---
name: publish extension
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.3.1)
        required: true
        type: string
      targets:
        description: Registries to publish to
        required: true
        default: both
        type: choice
        options:
          - both
          - vscode
          - openvsx

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  # Attaching the VSIX to the release.
  contents: write
  # Mints the OIDC token, used both for the provenance attestation and for
  # Entra ID federated auth.
  id-token: write
  # Recording the build-provenance attestation.
  attestations: write

jobs:
  publish:
    name: Publish extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Resolve release metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TARGETS: ${{ inputs.targets }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${EVENT_NAME}" = "release" ]; then
            tag="${RELEASE_TAG}"
            targets="both"
          else
            tag="${INPUT_TAG}"
            targets="${INPUT_TARGETS}"
          fi
          case "${tag}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Error: tag '${tag}' is not of the form vX.Y.Z."
              exit 1
              ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${tag} to: ${targets}"

      # Pinned exactly, unlike the floating 22.x elsewhere in CI. The retry path
      # below depends on a rebuild of a tag producing identical bytes, and the
      # deflate streams come from Node's bundled zlib -- which normalize-vsix.mjs
      # deliberately never touches, since it does not re-compress. A patch bump
      # between the original publish and a `targets:`-scoped retry could therefore
      # change the artifact. Bumping this is a deliberate act: it invalidates digest
      # comparison against releases published on the previous version.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A mismatch means the tag and the manifest disagree about what is
      # being shipped; both registries key releases off the manifest version.
      - name: Verify tag matches package.json version
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          manifest="v$(node -p "require('./package.json').version")"
          if [ "${manifest}" != "${TAG}" ]; then
            echo "Error: tag ${TAG} does not match package.json (${manifest})."
            exit 1
          fi

      # One package ships to both registries, so the marketplace README
      # preparation happens exactly one way.
      #
      # `verify-reproducible` rather than `package-vsix`: the retry path below is
      # only safe if a rebuild of this tag yields identical bytes, and this is the
      # one place that assumption is load-bearing. It packages twice under
      # different umasks and fails the release if they disagree, so a regression in
      # the pinning cannot reach a registry. The surviving artifact is byte-identical
      # to the first build by definition, so either may ship. Costs one extra build
      # per release.
      - name: Build VSIX and verify reproducibility
        id: build
        run: |
          make verify-reproducible
          vsix="invisible-squiggles-$(node -p "require('./package.json').version").vsix"
          if [ ! -f "${vsix}" ]; then
            echo "Error: ${vsix} was not produced by make verify-reproducible."
            exit 1
          fi
          echo "vsix=${vsix}" >> "$GITHUB_OUTPUT"

      # Attests the exact file that the publish steps below ship.
      #
      # `make package-vsix` pins entry timestamps, Unix modes, and entry order, so
      # a rebuild of this tag produces byte-identical output
      # (`make verify-reproducible` proves it). That is what makes a partial retry
      # safe: re-dispatching with `targets: vscode` after Open VSX already
      # succeeded rebuilds the same bytes, so both registries agree.
      #
      # Note what this step does NOT protect. It has no `if:` guard, so a retry
      # mints a *fresh* attestation over whatever it just built -- those bytes
      # always verify. Provenance therefore cannot detect a registry-vs-registry
      # divergence; reproducibility is the only thing preventing it. Before the
      # pinning, a retry left the two registries holding different bytes, the
      # release asset clobbered with the later build, and one tag carrying two
      # independently valid attestations.
      # Verify with:
      #   gh attestation verify <file>.vsix --repo michen00/invisible-squiggles
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.build.outputs.vsix }}

      # Best-effort, and deliberately non-fatal. The registries below are the
      # release; a missing download convenience on the release page is not a
      # reason to skip them. Before this guard existed, a refused upload took
      # both publish steps down with it and a tagged, announced release shipped
      # to neither registry.
      #
      # Immutable releases are enabled for this repository, and they freeze a
      # release's assets at the moment it is published. This job only runs after
      # that point -- its trigger is `release: published` -- and the asset does
      # not exist until the build step above produces it, so no ordering of these
      # steps can attach one. GitHub refuses the upload with HTTP 422. Restoring
      # the asset means creating the release as a draft, uploading, and only then
      # publishing: a change to who creates the release, not to this step.
      #
      # Nothing becomes unrecoverable. `make verify-reproducible` rebuilds the
      # exact bytes from the tag, and the attestation above covers them.
      - name: Attach the VSIX to the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VSIX: ${{ steps.build.outputs.vsix }}
        run: |
          # Skipping a release already known to be frozen keeps a genuine failure
          # -- bad credentials, a missing file, a network fault -- visible as a
          # failed step, rather than teaching everyone to ignore a red mark that
          # appears on every single release.
          if [ "$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.immutable')" = "true" ]; then
            echo "::notice::${TAG} is immutable; assets froze when it was" \
              "published. Skipping upload."
            exit 0
          fi
          gh release upload "${TAG}" "${VSIX}" --clobber

      # Azure DevOps retires global PATs on 2026-12-01, and a global PAT is the
      # only kind that can reach the Marketplace today. Setting the AZURE_*
      # repository variables switches this job to Entra ID federated auth, which
      # stores no long-lived secret. Until then it falls back to VSCE_PAT.
      - name: Authenticate to Microsoft Entra ID
        id: entra
        if: >-
          vars.AZURE_CLIENT_ID != '' &&
          contains(fromJSON('["both", "vscode"]'), steps.metadata.outputs.targets)
        uses: azure/login@v3
        # A failed login must not abort the job: the publish step below falls
        # back to VSCE_PAT when this step's outcome is not success, and that
        # branch is unreachable if the job dies here.
        continue-on-error: true
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # The two registries are independent services holding independent
      # credentials, so neither may withhold the release from the other. Both
      # publishes are therefore non-fatal *as steps*, and the gate below turns
      # either failure back into a failed job.
      #
      # This is not hypothetical. On v0.4.0 an unusable Marketplace PAT failed
      # this step, which skipped Open VSX behind it -- whose own credentials were
      # never even tried -- and the release reached neither registry.
      #
      # Recover a partial publish by re-dispatching with `targets` set to
      # whichever registry is missing. The build above is reproducible, so the
      # retry ships bytes identical to the ones that already landed.
      - name: Publish to VS Code Marketplace
        id: vscode
        continue-on-error: true
        if: contains(fromJSON('["both", "vscode"]'), steps.metadata.outputs.targets)
        env:
          ENTRA: ${{ steps.entra.outcome }}
          VSCE_PAT: ${{ secrets['VSCE_PAT'] }}
          VSIX: ${{ steps.build.outputs.vsix }}
        run: |
          if [ "${ENTRA}" = "success" ]; then
            echo "Publishing with Entra ID federated credentials."
            npx vsce publish --azure-credential --packagePath "${VSIX}"
          elif [ -n "${VSCE_PAT}" ]; then
            echo "Publishing with VSCE_PAT. Migrate to Entra ID before 2026-12-01."
            npx vsce publish --packagePath "${VSIX}"
          else
            echo "Error: no Marketplace credentials. Set the AZURE_CLIENT_ID and"
            echo "AZURE_TENANT_ID repository variables, or the VSCE_PAT secret."
            exit 1
          fi

      - name: Publish to Open VSX
        id: openvsx
        continue-on-error: true
        if: >-
          !cancelled() &&
          contains(fromJSON('["both", "openvsx"]'), steps.metadata.outputs.targets)
        env:
          OVSX_PAT: ${{ secrets['OVSX_PAT'] }}
          VSIX: ${{ steps.build.outputs.vsix }}
        run: |
          if [ -z "${OVSX_PAT}" ]; then
            echo "Error: OVSX_PAT secret is not configured."
            exit 1
          fi
          npx ovsx publish "${VSIX}"

      # `continue-on-error` hides a failed publish from the job's own status, so
      # without this step a release that reached neither registry would report
      # success -- trading the old failure mode for a quieter, worse one.
      #
      # A skipped step means the registry was not requested, which is not a
      # failure. Only a requested target that did not publish fails the job.
      - name: Verify every requested registry published
        if: '!cancelled()'
        env:
          OPENVSX: ${{ steps.openvsx.outcome }}
          VSCODE: ${{ steps.vscode.outcome }}
        run: |
          failed=0
          for entry in "VS Code Marketplace:${VSCODE}" "Open VSX:${OPENVSX}"; do
            registry="${entry%:*}"
            outcome="${entry##*:}"
            case "${outcome}" in
              success) echo "${registry}: published." ;;
              skipped) echo "${registry}: not requested." ;;
              *)
                echo "::error::${registry}: ${outcome}. Fix the credentials," \
                  "then re-dispatch this workflow with targets set to" \
                  "this registry alone."
                failed=1
                ;;
            esac
          done
          exit "${failed}"
