---
name: Test bot-automerge

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/bot-automerge.yml
      - .github/workflows/bot-automerge-disarm.yml
      - .github/workflows/test-bot-automerge.yml
      - .github/dependabot.yml
      - scripts/test-bot-automerge.cjs
  push:
    branches: [main]
    paths:
      - .github/workflows/bot-automerge.yml
      - .github/workflows/bot-automerge-disarm.yml
      - .github/workflows/test-bot-automerge.yml
      - .github/dependabot.yml
      - scripts/test-bot-automerge.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bot-automerge:
    name: Test bot-automerge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test bot-automerge
        run: |
          scripts/test-bot-automerge.cjs
