---
name: Test bot-automerge

# The paths are the files the suite reads (the two workflows whose steps it runs and
# dependabot.yml), the suite itself, and this file.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/bot-automerge.yml
      - .github/workflows/bot-automerge-disarm.yml
      - .github/workflows/test-bot-automerge.yml
      - .github/dependabot.yml
      - scripts/test-bot-automerge.cjs
  push:
    branches: [main]
    paths:
      - .github/workflows/bot-automerge.yml
      - .github/workflows/bot-automerge-disarm.yml
      - .github/workflows/test-bot-automerge.yml
      - .github/dependabot.yml
      - scripts/test-bot-automerge.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bot-automerge:
    name: Test bot-automerge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # No OS matrix and no `npm ci`: the suite needs no dependency, and runs the
      # workflows' shell steps under the same bash they run under.
      - name: Test bot-automerge
        run: |
          scripts/test-bot-automerge.cjs
