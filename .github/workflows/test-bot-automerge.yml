---
name: Test bot-automerge

# The path filter names the files the suite reads -- the two workflows whose steps it
# runs, dependabot.yml for the ecosystem names, and the suite itself -- plus this file,
# so that an edit to how the suite runs runs it. The suite reads no other workflow, so
# an edit to one needs no run here. The CI complete job runs the suite on every pull
# request regardless.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/bot-automerge.yml
      - .github/workflows/bot-automerge-disarm.yml
      - .github/workflows/test-bot-automerge.yml
      - .github/dependabot.yml
      - scripts/test-bot-automerge.cjs
  push:
    branches: [main]
    paths:
      - .github/workflows/bot-automerge.yml
      - .github/workflows/bot-automerge-disarm.yml
      - .github/workflows/test-bot-automerge.yml
      - .github/dependabot.yml
      - scripts/test-bot-automerge.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bot-automerge:
    name: Test bot-automerge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # No OS matrix and no `npm ci`: the suite reads files in the tree and runs their
      # shell steps under the runner's bash with a stand-in for `gh`, which needs no
      # dependency and is the shell those workflows run under anyway.
      - name: Test bot-automerge
        run: |
          scripts/test-bot-automerge.cjs
