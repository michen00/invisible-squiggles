toml-version = 'v1.0.0'

# Package managers write the lock files.
[files]
exclude = ['**/*.lock']

[format.rules]
string-quote-style = 'single'

# Tools that write pyproject.toml, such as uv and pyproject-fmt, use double quotes;
# tombi only lints it.
[[overrides]]
files.include = ['pyproject.toml']
format.enabled = false
